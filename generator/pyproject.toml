[project]
name = "ocr-rag-generator"
version = "0.1.0"
description = "Synthetic document generator — fixture factory for the pipeline"
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.8",
    "pymupdf>=1.24",
    "pillow>=10.4",
    "faker>=30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8.6",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# PyMuPDF ships partial type stubs that trip strict mode; treat it as untyped.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
