[project]
name = "ocr-rag-backend"
version = "0.1.0"
description = "Document intelligence pipeline — API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "python-magic>=0.4.27",
    "boto3>=1.35",
    "pymupdf>=1.24",
    "openai>=3.6,<4",
    # The synthetic-document generator, reused by POST /v1/documents/synthetic.
    "ocr-rag-generator",
]

[tool.uv.sources]
ocr-rag-generator = { path = "../generator", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8.6",
    "mypy>=1.13",
    "moto[s3]>=5.0",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# TC* (flake8-type-checking) is intentionally omitted: SQLAlchemy and Pydantic
# resolve annotations at runtime, so moving those imports into TYPE_CHECKING
# blocks breaks mapper configuration.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# PyMuPDF ships partial stubs that trip strict mode; treat it and python-magic
# as fully untyped.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "fitz", "magic"]
follow_imports = "skip"
follow_untyped_imports = true

# The generator is its own strict-checked package; don't re-check it here.
[[tool.mypy.overrides]]
module = ["generator", "generator.*"]
follow_imports = "skip"
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
